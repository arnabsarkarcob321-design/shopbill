[project]
name = "shopbill-api"
version = "1.0.0"
description = "ShopBill Cloud Sync, Identity & Backup API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt[crypto]>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
